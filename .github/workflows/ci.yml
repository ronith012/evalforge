#
# Continuous integration (TEST_STRATEGY §8; TRD-021, TRD-023, TRD-024, TRD-237; OD-24, OD-31, OD-32).
# Status: written in Milestone 15. Not yet executed on GitHub: no remote repository is connected in this
# workspace. Each job is listed in docs/MILESTONE_15_RECORD.md with its verification status.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Install locked environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked pytest

  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Install locked environment
        run: uv sync --locked --python 3.12
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format check
        run: uv run --locked ruff format --check .
      - name: mypy --strict (required gate, OD-15)
        run: uv run --locked mypy --strict

  audit:
    name: dependency audit (pip-audit, TRD-023)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Install locked environment
        run: uv sync --locked --python 3.12
      - name: pip-audit
        run: uv run --locked pip-audit

  build:
    name: build and check artifacts (TST-E2E-004, TST-E2E-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check artifact contents
        run: uv run --locked python scripts/check_artifacts.py dist
      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/evalforge --version

  dco:
    name: Developer Certificate of Origin (OD-31, OD-32)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-off on every commit in the pull request
        run: python3 scripts/check_dco.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  secret-scan:
    name: secret scan (gitleaks v8.30.1, OD-24)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify gitleaks (MIT licence)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the working tree for secrets (output redacted)
        run: ./gitleaks dir --redact --no-banner .
